name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # 런타임 의존성이 없으므로 설치 단계가 없다.
      - name: 테스트 (무작위 여행 1,500건 포함)
        run: python3 tests/run.py

  # 폐루프 검증을 크게 한 번 더 돌린다. 실패하면 시드가 출력되어 재현 가능하다.
  deep-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 무작위 여행 50,000건 폐루프 검증
        run: python3 -m settle verify --fuzz 50000
